<!--#block:references-->
  <div style="height:18px;"></div>
  <div style="display:flex; flex-wrap:wrap; gap:8px;">
    <span style="font-size:11px; color:var(--text-muted); align-self:center;">Riferimenti rapidi:</span>
    <button class="ref" type="button" data-ask="Mostrami la roadmap del progetto attivo"><i class="ti ti-map-2"></i> Roadmap</button>
    <button class="ref" type="button" data-ask="Mostrami la checklist del progetto attivo"><i class="ti ti-list-check"></i> Checklist</button>
    <button class="ref" type="button" data-ask="Mostrami EMPIRE_OPEN_ITEMS"><i class="ti ti-clipboard-list"></i> Open items</button>
    <button class="ref" type="button" data-ask="Mostrami le ultime 20 righe del SESSION_LOG"><i class="ti ti-history"></i> Session log</button>
  </div>

  <div style="height:1px; background:var(--border); margin:20px 0;"></div>
<!--#block:inputs-->
  <div style="height:1px; background:var(--border); margin:22px 0 18px;"></div>
  <div class="addg"><div style="font-weight:500; margin-bottom:6px;"><i class="ti ti-note"></i> {{NOTES_LABEL}}</div>
    <textarea id="note" placeholder="{{NOTES_PLACEHOLDER}}"></textarea></div>
  <div class="addg"><div style="font-weight:500; margin:14px 0 6px;"><i class="ti ti-square-plus"></i> Nuova voce Checklist <span style="font-size:11px; color:var(--text-muted); font-weight:400;">(task eseguibile sotto una milestone)</span></div>
    <input id="addck" type="text" placeholder="es. Mx.y — task"></div>
  <div class="addg"><div style="font-weight:500; margin:14px 0 6px;"><i class="ti ti-map-pin-plus"></i> Nuova voce Roadmap <span style="font-size:11px; color:var(--text-muted); font-weight:400;">(milestone/obiettivo)</span></div>
    <input id="addrm" type="text" placeholder="es. Mx — obiettivo strategico"></div>
<!--#block:action-->
  <div style="display:flex; justify-content:flex-end; margin-top:14px;">
    <button id="conf" type="button" style="background:var(--text-accent); color:var(--surface-2); border:none; border-radius:var(--radius); padding:10px 20px; font-weight:500; cursor:pointer;">{{CONFIRM_LABEL}}</button>
  </div>
<!--#block:end-->
